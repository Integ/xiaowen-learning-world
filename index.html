<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#bdebdc">
  <meta name="description" content="为学龄前儿童设计的图形化语言启蒙小游戏">
  <title>小文认知世界</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" id="gameShell">
    <canvas id="fxCanvas" aria-hidden="true"></canvas>

    <section class="screen welcome is-active" id="welcomeScreen" aria-label="开始游戏">
      <div class="sky-decor" aria-hidden="true">
        <i class="cloud cloud-one"></i><i class="cloud cloud-two"></i><i class="sun"></i>
      </div>
      <div class="welcome-card">
        <div class="logo-orbit" aria-hidden="true">
          <span class="orbit-item orbit-apple">🍎</span>
          <span class="orbit-item orbit-ball">⚽</span>
          <span class="orbit-item orbit-book">📕</span>
          <div class="mascot"><span class="ear left"></span><span class="ear right"></span><span class="face">🐻</span><span class="wave">👋</span></div>
        </div>
        <button class="play-button" id="playButton" aria-label="开始游戏">
          <span class="play-triangle" aria-hidden="true"></span>
          <span class="tap-hand" aria-hidden="true">👆</span>
        </button>
      </div>
      <div class="hills" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>

    <section class="screen world-screen" id="worldScreen" aria-label="选择场景">
      <header class="icon-bar">
        <button class="round-button music-button" data-action="music" aria-label="打开或关闭音乐">♫</button>
        <div class="mascot-mini" aria-hidden="true">🐻</div>
        <div class="star-pouch" id="totalStars" aria-label="获得的星星"><i>☆</i><i>☆</i><i>☆</i></div>
      </header>
      <div class="world-clouds" aria-hidden="true"><i></i><i></i></div>
      <div class="scene-grid" id="sceneGrid"></div>
    </section>

    <section class="screen play-screen" id="playScreen" aria-label="认识物品">
      <div class="room-backdrop" aria-hidden="true"></div>
      <header class="icon-bar play-bar">
        <button class="round-button" data-action="home" aria-label="返回场景选择">⌂</button>
        <div class="progress-pips" id="progressPips" aria-label="本轮进度"></div>
        <button class="round-button music-button" data-action="music" aria-label="打开或关闭音乐">♫</button>
      </header>

      <div class="prompt-orb" id="promptOrb" aria-live="polite">
        <button id="repeatPrompt" aria-label="再听一次"><span id="promptIcon">👆</span></button>
        <div class="sound-rings" aria-hidden="true"><i></i><i></i></div>
      </div>

      <div class="object-stage" id="objectStage"></div>

      <button class="page-arrow page-prev" id="pagePrev" aria-label="上一组">‹</button>
      <button class="page-arrow page-next" id="pageNext" aria-label="下一组">›</button>

      <div class="reward" id="reward" aria-hidden="true"><span>⭐</span></div>
    </section>

    <div class="audio-hint" id="audioHint" aria-hidden="true">🔊</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
