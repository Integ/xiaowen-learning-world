<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9f3f8">
  <meta name="description" content="为学龄前儿童设计的家庭物品认知与语言启蒙小游戏">
  <title>小文认知世界｜我的家</title>
  <style>
    :root{--ink:#30445f;--muted:#74839a;--sky:#d9f3f8;--blue:#59a9d6;--orange:#f38d68}
    *{box-sizing:border-box}html{background:#eef9fb}body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0 270px,#f6fbf4 270px);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",Arial,sans-serif}button{font:inherit}button:focus-visible{outline:4px solid #2a8ac1;outline-offset:3px}.app{min-height:100vh;padding:22px clamp(16px,4vw,54px) 30px;position:relative;overflow:hidden}.top,.hero,.rooms,.game,footer{width:min(1120px,100%);margin-inline:auto;position:relative;z-index:2}.sun{position:absolute;right:6%;top:95px;color:#ffd05f;font-size:82px;animation:turn 18s linear infinite}.cloud{position:absolute;width:95px;height:28px;border-radius:100px;background:#ffffffb8}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:42px;height:42px;left:18px;top:-20px}.cloud:after{width:52px;height:52px;right:12px;top:-27px}.c1{left:3%;top:155px}.c2{right:27%;top:65px;transform:scale(.7)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{display:grid;place-items:center;width:50px;height:50px;border-radius:18px;background:#fff;box-shadow:0 7px 0 #3c80991f;font-size:27px}.brand strong{display:block;font-size:20px}.brand small{color:#5f8290;font-weight:700}.actions{display:flex;align-items:center;gap:12px}.lang{display:flex;background:#ffffffbd;padding:4px;border-radius:16px}.lang button{border:0;background:transparent;color:#688394;padding:9px 13px;border-radius:12px;font-weight:800;cursor:pointer}.lang button.active{background:#fff;color:#287ba8;box-shadow:0 3px 10px #386e8b1f}.stars{min-width:74px;padding:9px 14px;background:#fff;border-radius:17px;font-size:20px;font-weight:900;box-shadow:0 6px 0 #3e7b941c}
    .hero{min-height:180px;padding:30px 36px;display:flex;align-items:center;justify-content:space-between}.eyebrow{display:inline-block;color:#3e91ad;background:#ffffff94;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:900}h1{margin:10px 0 5px;font-size:clamp(36px,5vw,58px);letter-spacing:-.04em;line-height:1.05}h1 span{color:#f16d59;margin-left:.2em;text-decoration:underline;text-decoration-color:#ffd970;text-decoration-thickness:8px;text-underline-offset:4px}.hero p{margin:0;font-size:17px;font-weight:700;color:#668091}.mascot{width:154px;height:128px;display:grid;place-items:center;background:#ffe095;border-radius:56% 44% 46% 54%;font-size:84px;box-shadow:inset 0 -10px 0 #ffac4c2b}.mascot i{position:absolute;margin:-70px 0 0 -115px;font-style:normal;font-size:38px;animation:wave 1.8s ease-in-out infinite;transform-origin:bottom right}
    .rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.rooms button{min-height:70px;border:3px solid transparent;border-radius:23px;background:#ffffffd0;color:var(--ink);cursor:pointer;font-weight:900;font-size:18px;box-shadow:0 7px 0 #426a7e1a;transition:.18s}.rooms button:hover{transform:translateY(-3px)}.rooms button.active{border-color:var(--room);background:#fff;box-shadow:0 8px 0 color-mix(in srgb,var(--room) 35%,transparent)}.rooms span{font-size:28px;margin-right:8px}
    .game{padding:24px;background:#fffffff0;border:3px solid #fff;border-radius:34px;box-shadow:0 22px 60px #3c67772b,0 8px 0 #73a2af1f}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.modes{display:flex;flex-wrap:wrap;gap:8px}.modes button{border:0;background:#f0f5f7;color:#617386;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:900;cursor:pointer}.modes button.active{background:#dff3ff;color:#247cae}.room-title{font-size:21px;font-weight:900;white-space:nowrap}.prompt{min-height:88px;display:flex;align-items:center;gap:15px;background:#fff8df;border:2px dashed #f1cc62;border-radius:23px;padding:12px 18px;margin-bottom:18px;position:relative;overflow:hidden}.prompt.success{background:#e7fae9;border-color:#68c778}.speaker{flex:0 0 auto;width:55px;height:55px;border:0;border-radius:18px;background:#fff;font-size:27px;box-shadow:0 5px 0 #b98e3626;cursor:pointer}.prompt small{display:block;color:#8d7d56;font-size:12px;font-weight:900}.prompt strong{font-size:clamp(18px,2.4vw,25px)}
    .objects{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.object{min-height:190px;border:3px solid #edf1f3;border-radius:25px;background:linear-gradient(180deg,color-mix(in srgb,var(--color) 14%,white),white 64%);position:relative;cursor:pointer;color:var(--ink);padding:15px 9px 12px;box-shadow:0 7px 0 #e6ebed;transition:.18s;animation:appear .45s var(--delay) both}.object:hover{transform:translateY(-7px) rotate(-1deg);border-color:color-mix(in srgb,var(--color) 65%,white);box-shadow:0 11px 0 color-mix(in srgb,var(--color) 25%,#e6ebed)}.object.selected{border-color:var(--color);box-shadow:0 8px 0 color-mix(in srgb,var(--color) 35%,#e6ebed)}.emoji{display:grid;place-items:center;width:96px;height:96px;margin:0 auto 7px;border-radius:30px;background:#ffffffb8;font-size:60px}.object strong{display:block;font-size:19px}.object small{display:block;color:var(--muted);font-weight:800;margin-top:2px}.note{position:absolute;right:10px;top:10px;width:25px;height:25px;display:grid;place-items:center;color:#fff;background:var(--color);border-radius:50%;font-size:13px}.sentence-actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.sentence-actions button{border:0;border-radius:16px;padding:12px 18px;font-weight:900;color:#fff;background:#5ba9d4;cursor:pointer;box-shadow:0 5px 0 #3985af}.sentence-actions button:last-child{background:#f38d68;box-shadow-color:#cd6e4d}footer{text-align:center;color:#74838b;font-size:14px;font-weight:700;padding-top:24px}footer span{color:#4e8ca6}
    .celebrate:after{content:"★  ●  ▲  ★";position:absolute;right:8%;top:32%;color:#f28b62;font-size:22px;letter-spacing:12px;animation:pop .8s ease-out both}@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(18deg)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pop{from{transform:translateY(18px) scale(.2);opacity:0}50%{opacity:1}to{transform:translateY(-18px) rotate(20deg);opacity:0}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:820px){.objects{grid-template-columns:repeat(3,1fr)}.toolbar{align-items:flex-start;flex-direction:column-reverse}}@media(max-width:560px){.app{padding:14px 12px 24px}.brand small{display:none}.brand strong{font-size:17px}.actions{align-items:flex-end;flex-direction:column-reverse}.lang button{padding:7px 9px;font-size:12px}.hero{min-height:140px;padding:18px 10px}.hero p{font-size:14px;max-width:72%}.mascot{position:absolute;right:4px;bottom:4px;width:92px;height:82px;font-size:55px}h1{font-size:34px}.rooms{grid-template-columns:repeat(2,1fr);gap:9px}.rooms button{min-height:57px;font-size:16px;border-radius:18px}.game{padding:13px;border-radius:25px}.modes{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.modes button{padding:9px 5px;font-size:12px}.objects{grid-template-columns:repeat(2,1fr);gap:10px}.object{min-height:158px}.object:last-child{grid-column:1/-1;width:calc(50% - 5px);justify-self:center}.emoji{width:78px;height:78px;font-size:49px}.sentence-actions{flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="app">
    <div class="sun" aria-hidden="true">☀</div><div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div>
    <header class="top">
      <div class="brand"><span class="brand-icon">🏠</span><div><strong>小文认知世界</strong><small>在家里发现新词语</small></div></div>
      <div class="actions"><div class="lang" aria-label="选择语言"><button data-lang="zh" class="active">中文</button><button data-lang="en">English</button></div><div class="stars" aria-label="获得的星星">⭐ <span id="stars">0</span></div></div>
    </header>
    <section class="hero"><div><span class="eyebrow">今天我们去哪里？</span><h1>一起探索<span>我的家</span></h1><p>点一点、听一听、说一说，认识身边每一样东西。</p></div><div class="mascot" aria-hidden="true"><i>👋</i>🐻</div></section>
    <nav class="rooms" id="rooms" aria-label="选择房间"></nav>
    <section class="game">
      <div class="toolbar"><div class="modes" id="modes" aria-label="选择玩法"><button data-mode="explore" class="active">👆 自由探索</button><button data-mode="find">👂 听音找物</button><button data-mode="sentence">💬 学说句子</button></div><div class="room-title" id="roomTitle"></div></div>
      <div class="prompt" id="prompt"><button class="speaker" id="speaker" aria-label="播放提示">🔊</button><div><small id="promptLabel">小提示</small><strong id="promptText">点击物品，听听它叫什么！</strong></div></div>
      <div class="objects" id="objects"></div><div class="sentence-actions" id="sentenceActions" hidden><button id="repeat">🔊 再听一次</button><button id="next">下一个句子 →</button></div>
    </section>
    <footer><span>给家长的小提示：</span>陪孩子一起大声说出词语，会记得更牢哦！</footer>
  </main>
  <script>
    const rooms={
      living:{name:"客厅",icon:"🛋️",color:"#ff9c72",items:[["🛋️","沙发","sofa","#ff8c68","我坐在沙发上。"],["📺","电视","TV","#7d91ff","我在看电视。"],["🪴","植物","plant","#58bd87","这是一盆植物。"],["💡","台灯","lamp","#f5c84b","台灯亮起来了。"],["🧸","玩具熊","teddy bear","#b98662","我喜欢玩具熊。"]]},
      bedroom:{name:"卧室",icon:"🛏️",color:"#8d7df0",items:[["🛏️","床","bed","#8f83ef","我在床上睡觉。"],["☁️","枕头","pillow","#f09cb2","枕头软软的。"],["🧦","袜子","socks","#55afd9","我穿上袜子。"],["📚","图画书","picture book","#e96d69","我在看图画书。"],["⏰","闹钟","clock","#f0b548","闹钟响了。"]]},
      kitchen:{name:"厨房",icon:"🍳",color:"#f3b94f",items:[["🍎","苹果","apple","#ee625d","这是一个红苹果。"],["🥛","牛奶","milk","#68aada","我想喝牛奶。"],["🥣","碗","bowl","#ef9c56","碗里有食物。"],["🥄","勺子","spoon","#8497a5","我用勺子吃饭。"],["🧊","冰箱","fridge","#64b7b1","牛奶放进冰箱。"]]},
      bathroom:{name:"浴室",icon:"🛁",color:"#55b8d9",items:[["🪥","牙刷","toothbrush","#eb6e7c","我用牙刷刷牙。"],["🧼","肥皂","soap","#8c82ec","我用肥皂洗手。"],["🛁","浴缸","bathtub","#4fb6d7","我在浴缸里洗澡。"],["🧻","纸巾","tissue","#77a8bd","这是一卷纸巾。"],["🪞","镜子","mirror","#55aaa3","我在镜子里看到自己。"]]}
    };
    let roomKey="living",mode="explore",lang="zh",selected=null,target=2,sentence=0,stars=Number(localStorage.getItem("xiaowen-stars")||0);
    const $=s=>document.querySelector(s),roomNav=$("#rooms"),objects=$("#objects"),prompt=$("#prompt"),promptLabel=$("#promptLabel"),promptText=$("#promptText");
    $("#stars").textContent=stars;
    function speak(item,full=false){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(full?item[4]:(lang==="zh"?item[1]:item[2]));u.lang=full||lang==="zh"?"zh-CN":"en-US";u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}
    function drawRooms(){roomNav.innerHTML=Object.entries(rooms).map(([k,r])=>`<button data-room="${k}" class="${k===roomKey?'active':''}" style="--room:${r.color}"><span>${r.icon}</span>${r.name}</button>`).join("")}
    function draw(){const room=rooms[roomKey];drawRooms();$("#roomTitle").textContent=`${room.icon} ${room.name}`;objects.innerHTML=room.items.map((x,i)=>`<button class="object ${selected===i?'selected':''}" data-item="${i}" style="--color:${x[3]};--delay:${i*70}ms" aria-label="${x[1]}，${x[2]}"><span class="emoji">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small><span class="note">♪</span></button>`).join("");$("#sentenceActions").hidden=mode!=="sentence";updatePrompt()}
    function updatePrompt(){const room=rooms[roomKey];prompt.classList.remove("success","celebrate");if(mode==="find"){promptLabel.textContent="请找到";promptText.textContent=lang==="zh"?room.items[target][1]:room.items[target][2]}else if(mode==="sentence"){promptLabel.textContent="跟我说";promptText.textContent=room.items[selected??sentence][4]}else{promptLabel.textContent="小提示";promptText.textContent=selected===null?"点击物品，听听它叫什么！":room.items[selected][4]}}
    roomNav.addEventListener("click",e=>{const b=e.target.closest("button[data-room]");if(!b)return;roomKey=b.dataset.room;selected=null;target=(Object.keys(rooms).indexOf(roomKey)+1)%5;sentence=0;draw()});
    $("#modes").addEventListener("click",e=>{const b=e.target.closest("button[data-mode]");if(!b)return;mode=b.dataset.mode;selected=null;document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("active",x===b));draw()});
    objects.addEventListener("click",e=>{const b=e.target.closest("button[data-item]");if(!b)return;const i=Number(b.dataset.item),item=rooms[roomKey].items[i];if(mode==="find"){if(i===target){stars++;localStorage.setItem("xiaowen-stars",stars);$("#stars").textContent=stars;prompt.classList.add("success","celebrate");promptLabel.textContent="找对啦";promptText.textContent="你真棒！";speak(item);setTimeout(()=>{target=(target+2)%5;updatePrompt()},900)}else{promptLabel.textContent="再试一次";promptText.textContent="仔细看一看，你一定能找到！"}}else{selected=i;speak(item,mode==="sentence");draw()}});
    document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button[data-lang]");if(!b)return;lang=b.dataset.lang;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("active",x===b));updatePrompt()});
    $("#speaker").onclick=()=>{const room=rooms[roomKey],i=mode==="find"?target:(selected??sentence);speak(room.items[i],mode==="sentence")};$("#repeat").onclick=()=>speak(rooms[roomKey].items[selected??sentence],true);$("#next").onclick=()=>{sentence=(sentence+1)%5;selected=null;draw()};draw();
  </script>
</body>
</html>
